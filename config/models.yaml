# Models that answer the prompts (SPEC FR-9). OpenRouter model IDs, used as `openrouter/<id>`.
# `family` decides judge routing (FR-12): answers from J1's own family go to J2.
#
# PINNED 2026-11-19: approved by Cynthia after a smoke test in which every ID answered one prompt
# (BUILD_PLAN M3.1; closes Open Questions 1 and 2).
# Prices: per million tokens, input/output, from OpenRouter on 2026-11-18.

answer_models:
  # frontier: one per family
  - {id: anthropic/claude-sonnet-5.5,   family: anthropic, size: frontier}  # $2/$10
  - {id: openai/gpt-6.2-sol,            family: openai,    size: frontier}  # $2/$10
  - {id: google/gemini-4-carbon,        family: google,    size: frontier}  # $2/$10
  - {id: meta-llama/llama-4-maverick,   family: meta,      size: frontier}  # $0.35/$1
  - {id: deepseek/deepseek-v4-pro,      family: deepseek,  size: frontier}  # $0.90/$1.50
  # small: each has a frontier sibling above (FR-22)
  - {id: anthropic/claude-haiku-5.5,    family: anthropic, size: small}     # $0.10/$0.50
  - {id: meta-llama/llama-3.1-8b-instruct, family: meta,   size: small}     # $0.02/$0.04
  - {id: deepseek/deepseek-v4.1-flash,  family: deepseek,  size: small}     # $0.05/$0.20

judges:
  # J1 judges everything except Anthropic answers, which go to J2 (FR-12).
  j1: {id: anthropic/claude-sonnet-5.5, family: anthropic}
  j2: {id: openai/gpt-6.2-sol,          family: openai}
